<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Aluno - Ondina de Paula</title>
    <style>
        /* === RESET E FUNDO LED ANIMADO === */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            overflow: hidden;
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: respirarLED 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        @keyframes respirarLED {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* === BOLHA INTERATIVA === */
        #cursor-glow {
            position: fixed; top: 0; left: 0; width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 0, 150, 0.4) 0%, transparent 60%);
            pointer-events: none; transform: translate(-50%, -50%);
            z-index: 0; filter: blur(60px); transition: width 0.3s, height 0.3s;
        }

        /* === TELA DE ABERTURA === */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #0b0b0b; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .intro-text { color: white; font-size: 2.5rem; opacity: 0; transform: translateY(20px); transition: all 0.5s ease; position: absolute; }
        .intro-mascot-show { opacity: 0; transform: scale(0.5); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: absolute; }
        .slide-up-out { transform: translateY(-100vh); }
        .fade-in-up { opacity: 1; transform: translateY(0) scale(1); }
        .fade-out { opacity: 0; transform: translateY(-20px); }

        /* === O MASCOTE === */
        .wrapper { position: relative; margin-top: 100px; z-index: 10; }
        #mascote-container {
            position: absolute; top: -145px; left: 50%;
            transform: translateX(-50%); z-index: 11; pointer-events: none;
        }
        svg.fantoche {
            width: 220px; height: 180px; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.3));
            animation: segurar 4s ease-in-out infinite; transform-origin: bottom center;
        }
        @keyframes segurar {
            0% { transform: rotate(0deg); } 33% { transform: rotate(2deg); }
            66% { transform: rotate(-2deg); } 100% { transform: rotate(0deg); }
        }
        #boca, #sobr-esq, #sobr-dir { transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }

        /* === O CARTÃO === */
        .card {
            position: relative; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 40px; border-radius: 24px; width: 100%; min-width: 400px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); z-index: 10;
            opacity: 0; transform: translateY(50px); transition: all 1s ease 0.5s;
        }
        .card.mostrar { opacity: 1; transform: translateY(0); }
        .secao { display: none; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .secao.ativa { display: block; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* === FORMULÁRIOS === */
        h2 { color: #1a365d; text-align: center; margin-bottom: 10px; font-size: 1.8rem; }
        p.subtexto { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #4a5568;}
        input {
            width: 100%; padding: 14px; border: 3px solid #e2e8f0; border-radius: 12px;
            background: #f8fafc; outline: none; transition: 0.3s; font-size: 16px; font-weight: 600;
        }
        input:focus { border-color: #9d4edd; background: #fff; }

        /* === CUSTOM DROPDOWNS (COM EFEITO MAGNÉTICO) === */
        .custom-dropdown { position: relative; width: 100%; font-size: 16px; font-weight: 600; user-select: none; cursor: pointer; }
        .dropdown-selecionado {
            padding: 14px; border: 3px solid #e2e8f0; border-radius: 12px;
            background: #f8fafc; color: #333; transition: all 0.3s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .dropdown-selecionado::after { content: '▼'; font-size: 12px; color: #9d4edd; transition: transform 0.3s; }
        .custom-dropdown.aberto .dropdown-selecionado { border-color: #9d4edd; background: #fff; }
        .custom-dropdown.aberto .dropdown-selecionado::after { transform: rotate(180deg); }
        
        .dropdown-opcoes {
            position: absolute; top: 110%; left: 0; right: 0; background: #ffffff;
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden;
            z-index: 99; opacity: 1; transform: translateY(0); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 5px; /* Espaço para o indicador magnético não colar nas bordas */
        }
        .dropdown-opcoes.oculto { opacity: 0; transform: translateY(-10px); pointer-events: none; }
        
        .opcao { 
            padding: 12px 16px; color: #4a5568; transition: color 0.2s; 
            position: relative; z-index: 2; /* Fica acima da bolha magnética */
        }
        .opcao:hover { color: #7b2cbf; }

        /* A Bolha Magnética do Menu (Seu efeito adaptado) */
        .hover-indicator {
            position: absolute;
            background-color: #f3e8ff;
            border-radius: 8px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); /* Mesma curva suave do seu site */
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* Botão */
        button {
            width: 100%; padding: 16px; background: #9d4edd; color: white; border: none;
            border-radius: 12px; font-weight: 800; font-size: 18px; cursor: pointer;
            transition: 0.2s; margin-top: 15px; box-shadow: 0 6px 0 #5a189a;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #5a189a; background: #7b2cbf; }
        button:active { transform: translateY(4px); box-shadow: 0 2px 0 #5a189a; }

        .resultado {
            margin-top: 20px; padding: 15px; border-radius: 12px; text-align: center;
            font-weight: bold; font-size: 1.1rem; display: none;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body>

    <div id="cursor-glow"></div>

    <div id="intro-screen">
        <h1 class="intro-text" id="intro-1">Odina de Paula</h1>
        <div class="intro-mascot-show" id="intro-2">
            <svg viewBox="0 0 100 100" style="width: 250px; height: 250px;">
                <ellipse cx="50" cy="50" rx="40" ry="45" fill="#ff9036" />
                <ellipse cx="50" cy="65" rx="18" ry="28" fill="#e86e13" /> 
                <circle cx="32" cy="40" r="12" fill="#fff" />
                <circle cx="68" cy="40" r="12" fill="#fff" />
                <circle cx="32" cy="40" r="4" fill="#000" />
                <circle cx="68" cy="40" r="4" fill="#000" />
                <path d="M 35 85 Q 50 95 65 85" fill="none" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>
    </div>

    <div class="wrapper">
        <div id="mascote-container">
            <svg id="bonequinho" class="fantoche" viewBox="0 0 200 180">
                <path d="M 60 180 C 60 120, 140 120, 140 180" fill="#e86e13" />
                <ellipse cx="100" cy="80" rx="55" ry="60" fill="#ff9036" />
                <path d="M 85 25 Q 90 5 100 20 Q 110 -5 115 25" fill="none" stroke="#a04d0b" stroke-width="5" stroke-linecap="round"/>
                <path d="M 75 35 Q 70 15 85 25" fill="none" stroke="#a04d0b" stroke-width="4" stroke-linecap="round"/>
                <path d="M 125 35 Q 130 15 115 25" fill="none" stroke="#a04d0b" stroke-width="4" stroke-linecap="round"/>
                <ellipse cx="100" cy="100" rx="22" ry="32" fill="#e86e13" />
                <circle cx="75" cy="70" r="15" fill="#fff" />
                <circle cx="125" cy="70" r="15" fill="#fff" />
                <circle id="pupila-esq" cx="75" cy="70" r="5" fill="#000" />
                <circle id="pupila-dir" cx="125" cy="70" r="5" fill="#000" />
                <rect id="sobr-esq" x="55" y="45" width="25" height="6" rx="3" fill="#a04d0b" transform-origin="67px 48px" />
                <rect id="sobr-dir" x="115" y="45" width="25" height="6" rx="3" fill="#a04d0b" transform-origin="127px 48px" />
                <path id="boca" d="M 80 130 Q 100 145 120 130" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
                <rect x="45" y="150" width="30" height="35" rx="15" fill="#ff9036" stroke="#e86e13" stroke-width="2"/>
                <rect x="125" y="150" width="30" height="35" rx="15" fill="#ff9036" stroke="#e86e13" stroke-width="2"/>
            </svg>
        </div>

        <div class="card" id="cartao-principal">
            
            <div id="secao-login" class="secao ativa">
                <h2>Portal de Fardamentos</h2>
                <p class="subtexto">Insira seu cadastro de aluno para acessar o estoque.</p>
                <div class="form-group"><label>Usuário / Matrícula</label><input type="text" placeholder="Ex: 101.502.333"></div>
                <div class="form-group"><label>Senha</label><input type="password" placeholder="••••••••"></div>
                <button onclick="fazerLogin()">Acessar Portal</button>
            </div>

            <div id="secao-fardamento" class="secao">
                <h2>Qual a sua farda?</h2>
                <p class="subtexto">Consulte o armário virtual da Ondina de Paula.</p>
                
                <div class="form-group">
                    <label>Tipo de Uniforme:</label>
                    <div class="custom-dropdown" id="dropdown-tipo">
                        <div class="dropdown-selecionado">Aula Regular (Padrão)</div>
                        <div class="dropdown-opcoes oculto">
                            <div class="opcao" data-value="normal">Aula Regular (Padrão)</div>
                            <div class="opcao" data-value="fisica">Educação Física</div>
                            <div class="opcao" data-value="casaco">Casaco de Frio</div>
                        </div>
                    </div>
                    <select id="tipoFarda" style="display: none;">
                        <option value="normal">Aula Regular (Padrão)</option>
                        <option value="fisica">Educação Física</option>
                        <option value="casaco">Casaco de Frio</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Seu Tamanho:</label>
                    <div class="custom-dropdown" id="dropdown-tamanho">
                        <div class="dropdown-selecionado">Tamanho P</div>
                        <div class="dropdown-opcoes oculto">
                            <div class="opcao" data-value="P">Tamanho P</div>
                            <div class="opcao" data-value="M">Tamanho M</div>
                            <div class="opcao" data-value="G">Tamanho G</div>
                            <div class="opcao" data-value="GG">Tamanho GG</div>
                        </div>
                    </div>
                    <select id="tamanhoFarda" style="display: none;">
                        <option value="P">Tamanho P</option>
                        <option value="M">Tamanho M</option>
                        <option value="G">Tamanho G</option>
                        <option value="GG">Tamanho GG</option>
                    </select>
                </div>

                <button onclick="verificarFarda()">Consultar Armário</button>
                <div id="resultado-farda" class="resultado"></div>
            </div>
        </div>
    </div>

    <script>
        // === 1. LUZ DINÂMICA ===
        const cursorGlow = document.getElementById('cursor-glow');
        document.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = `${e.clientX}px`;
            cursorGlow.style.top = `${e.clientY}px`;
            const hue = (e.clientX / window.innerWidth) * 360; 
            cursorGlow.style.background = `radial-gradient(circle, hsl(${hue}, 80%, 60%, 0.3) 0%, transparent 60%)`;
        });

        // === 2. INTRODUÇÃO ===
        window.onload = () => {
            const intro1 = document.getElementById('intro-1');
            const intro2 = document.getElementById('intro-2');
            const introScreen = document.getElementById('intro-screen');
            const card = document.getElementById('cartao-principal');

            setTimeout(() => { intro1.classList.add('fade-in-up'); }, 300);
            setTimeout(() => { 
                intro1.classList.remove('fade-in-up'); intro1.classList.add('fade-out');
                intro2.classList.add('fade-in-up');
            }, 1800);
            setTimeout(() => {
                introScreen.classList.add('slide-up-out');
                card.classList.add('mostrar');
            }, 3500);
        };

        // === 3. OLHOS DO MASCOTE ===
        const pupilaEsq = document.getElementById('pupila-esq');
        const pupilaDir = document.getElementById('pupila-dir');
        document.addEventListener('mousemove', (e) => {
            const raioMaximo = 6;
            const reatEsq = pupilaEsq.getBoundingClientRect();
            const reatDir = pupilaDir.getBoundingClientRect();
            const anguloEsq = Math.atan2(e.clientY - reatEsq.y, e.clientX - reatEsq.x);
            const anguloDir = Math.atan2(e.clientY - reatDir.y, e.clientX - reatDir.x);
            pupilaEsq.style.transform = `translate(${Math.cos(anguloEsq) * raioMaximo}px, ${Math.sin(anguloEsq) * raioMaximo}px)`;
            pupilaDir.style.transform = `translate(${Math.cos(anguloDir) * raioMaximo}px, ${Math.sin(anguloDir) * raioMaximo}px)`;
        });

        // === 4. LOGIN ===
        function fazerLogin() {
            event.target.innerHTML = "Abrindo Armário...";
            setTimeout(() => {
                document.getElementById('secao-login').classList.remove('ativa');
                document.getElementById('secao-fardamento').classList.add('ativa');
            }, 600);
        }

        // === 5. ESTOQUE E EXPRESSÕES ===
        const estoque = { 
            normal: { P: 10, M: 5, G: 0, GG: 2 }, 
            fisica: { P: 0, M: 12, G: 8, GG: 0 },
            casaco: { P: 3, M: 0, G: 5, GG: 1 } // Adicionado o estoque de casacos!
        };

        function verificarFarda() {
            const tipo = document.getElementById('tipoFarda').value;
            const tamanho = document.getElementById('tamanhoFarda').value;
            const resultado = document.getElementById('resultado-farda');
            const boca = document.getElementById('boca');
            const sobrEsq = document.getElementById('sobr-esq');
            const sobrDir = document.getElementById('sobr-dir');
            
            const quantidade = estoque[tipo][tamanho];
            resultado.style.display = 'block';

            if (quantidade > 0) {
                resultado.innerHTML = `🎉 Tem sim! <br> Pode ir lá buscar o tamanho ${tamanho}.`;
                resultado.style.backgroundColor = '#e6fffa';
                resultado.style.color = '#2c7a7b';
                boca.setAttribute('d', 'M 80 130 Q 100 155 120 130'); 
                sobrEsq.setAttribute('transform', 'rotate(-15) translateY(-8px)'); 
                sobrDir.setAttribute('transform', 'rotate(15) translateY(-8px)');
            } else {
                resultado.innerHTML = `😭 Acabou! <br> O tamanho ${tamanho} já era.`;
                resultado.style.backgroundColor = '#fff5f5';
                resultado.style.color = '#c53030';
                boca.setAttribute('d', 'M 80 145 Q 100 120 120 145'); 
                sobrEsq.setAttribute('transform', 'rotate(25) translateY(5px)'); 
                sobrDir.setAttribute('transform', 'rotate(-25) translateY(5px)');
            }
        }

        // MENU MAGNETICO 
        function configurarDropdown(idDropdown, idSelectReal) {
            const dropdown = document.getElementById(idDropdown);
            const selecionado = dropdown.querySelector('.dropdown-selecionado');
            const opcoesContainer = dropdown.querySelector('.dropdown-opcoes');
            const selectReal = document.getElementById(idSelectReal);
            const itensOpcao = dropdown.querySelectorAll('.opcao');

            // Cria a "bolha magnética" dinamicamente
            const indicator = document.createElement('div');
            indicator.classList.add('hover-indicator');
            opcoesContainer.appendChild(indicator);

            selecionado.addEventListener('click', function(e) {
                e.stopPropagation();
                document.querySelectorAll('.dropdown-opcoes').forEach(el => { if (el !== opcoesContainer) el.classList.add('oculto'); });
                document.querySelectorAll('.custom-dropdown').forEach(el => { if (el !== dropdown) el.classList.remove('aberto'); });
                opcoesContainer.classList.toggle('oculto');
                dropdown.classList.toggle('aberto');
            });

            itensOpcao.forEach(item => {
                // A LÓGICA MAGNÉTICA DA IMOBILIÁRIA ADAPTADA
                item.addEventListener('mouseenter', () => {
                    const rect = item.getBoundingClientRect();
                    const parentRect = opcoesContainer.getBoundingClientRect();
                    
                    indicator.style.width = `${item.offsetWidth}px`;
                    indicator.style.height = `${item.offsetHeight}px`;
                    indicator.style.left = `${item.offsetLeft}px`;
                    indicator.style.top = `${item.offsetTop}px`;
                    indicator.style.opacity = '1';
                });

                item.addEventListener('click', function() {
                    selecionado.innerHTML = this.innerHTML;
                    selectReal.value = this.getAttribute('data-value');
                    opcoesContainer.classList.add('oculto');
                    dropdown.classList.remove('aberto');
                });
            });

            // Esconde a bolha magnética quando o mouse sai do menu
            opcoesContainer.addEventListener('mouseleave', () => {
                indicator.style.opacity = '0';
            });
        }

        configurarDropdown('dropdown-tipo', 'tipoFarda');
        configurarDropdown('dropdown-tamanho', 'tamanhoFarda');

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.custom-dropdown')) {
                document.querySelectorAll('.dropdown-opcoes').forEach(el => el.classList.add('oculto'));
                document.querySelectorAll('.custom-dropdown').forEach(el => el.classList.remove('aberto'));
            }
        });
    </script>
</body>
</html>
